---
version: 2
plan:
  project-key: ATLAS
  key: ZGRAB2
  name: scanning-zgrab2
  description: test build of zgrab
variables:
  major_minor: v1.0
stages:
- Default Stage:
    manual: false
    final: false
    jobs:
    - build only
build only:
  key: BUILDONLY
  description: build the container
  docker:
    image: arb-artifactory.eng.netscout.com/docker-dev-local/atlas/golang/1.23.5:dev-v1.0.7b59975
    volumes:
      ${bamboo.working.directory}: ${bamboo.working.directory}
      ${bamboo.tmp.directory}: ${bamboo.tmp.directory}
      /var/run/docker.sock: /var/run/docker.sock
    docker-run-arguments: []
  requirements:
  - system.DinD
  artifact-subscriptions: []
  other:
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: 'false'
  tasks:
  - checkout:
      path: app/
      force-clean-build: false
      description: Checkout Default Repository
  - script:
      interpreter: SHELL
      scripts:
      - docker rm $(docker ps -aq)
      - docker rmi $(docker image ls -q)
      - echo "Disk Space available -- $(df -hk)"
      description: Delete all docker images from agent and show disk space
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/bin/bash        
        cd app
        go env -w GOFLAGS=-buildvcs=false
        make all
      description: Build requested Docker image and push it to artifactory
  final-tasks:
  - clean:
      description: clean up
repositories:
- atlas/zgrab2:
    scope: project
triggers:
- bitbucket-server-trigger:
    description: build on commit
branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 30
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
other:
  concurrent-build-plugin: system-default
---
version: 2
plan:
  key: ATLAS-ZGRAB2
plan-permissions:
- users:
  - jrich
  groups:
  - ARB_ATLAS_ADMINS
  permissions:
  - view
  - edit
  - build
...